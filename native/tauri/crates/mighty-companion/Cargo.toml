[package]
name = "mighty-companion"
version = "0.1.0"
description = "Mighty Code's companion pet (C# Core/Companion*.cs and the pure half of WinUI/CompanionOverlay.cs): preferences, the pet catalog and atlas checks, animation, the bubble and its layout, and the PetScene the platform draws. No Tauri, no OS code."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
mighty-core.workspace = true
# The pet's window and its display list (`PetScene`, `PetWindow`): the platform crates draw what this crate lays out.
mighty-platform.workspace = true
# The bubble answers a question as the pane's card does (`UserQuestionnaire`, `QuestionnaireProgress`) in the app's words
# (`strings`, `ToolPermissionStrings`).
mighty-run.workspace = true
# The progress card over the bubble is the page's progress panel of the pane the bubble shows (`steps::progress_of`, `shown_runs`).
mighty-graph.workspace = true
# The settings and the pets are read as the user's files are (`WorkspaceFiles.OpenFile`: `open_file` and the platform's handle checks).
mighty-composer.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# The plan's Markdown blocks (C#'s four line patterns).
regex.workspace = true
# The temporary file of the settings and an imported pet's folder (C# `Guid.NewGuid().ToString("N")`).
uuid.workspace = true
# The card key's guard: SHA-256 of the request's tool and input (C# `CompanionCardKey`).
sha2.workspace = true
# The pets' atlases (PNG or WebP, decoded once; C# reads them with Win2D).
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[dev-dependencies]
# The fake pet window's events (`PetWindow::events` hands over a tokio receiver).
tokio = { workspace = true, features = ["sync"] }
