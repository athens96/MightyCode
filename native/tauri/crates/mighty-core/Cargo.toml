[package]
name = "mighty-core"
version = "0.1.0"
description = "Mighty Code's state models, loading and frame model, with no Tauri dependency (the Rust side of MightyCode.Core)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true
unicode-segmentation.workspace = true
# MC-58: a bot's name is compared composed (NFC), so 한글 typed either way is one name.
unicode-normalization = "0.1"
indexmap.workspace = true
# MC-3: the daemon protocol carries process output as base64.
base64 = "0.23"
# MC-97: a trigger's `where` takes regular expressions (`matches`).
regex.workspace = true
