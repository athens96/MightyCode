[package]
name = "mightycode"
# The app's version (VERSION at the repository root); scripts/release.py does not bump it yet.
version = "0.5.8"
description = "Mighty Code (Rust + Tauri 2 host, skeleton)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The 0.4.x updater replaces MightyCode.exe: the binary keeps that name.
[[bin]]
name = "MightyCode"
path = "src/main.rs"

[features]
default = ["dev-harness"]
# Smoke tests, help-capture, perf scenario, resource verifier, fake CLI modes, and Tauri's unstable `get_webview`.
# Build a slim production binary with `--no-default-features`.
dev-harness = ["tauri/unstable"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# W9: build.rs checks the release stamp's update key (32 bytes of standard base64).
base64 = "0.22"

[dependencies]
mighty-core.workspace = true
mighty-composer.workspace = true
mighty-files.workspace = true
mighty-graph.workspace = true
mighty-platform.workspace = true
mighty-run.workspace = true
mighty-terminal.workspace = true
mighty-history.workspace = true
mighty-workmap.workspace = true
mighty-native.workspace = true
mighty-tools.workspace = true
mighty-accounts.workspace = true
mighty-updates.workspace = true
# W7: delegation, the Agent IO MCP servers and the exe's modes (delegation.rs, agent_io.rs, main.rs).
mighty-delegation.workspace = true
# W8: the phone (relay, direct, m1, push), remote workspaces v2 and screen share (mobile.rs, phone.rs, direct.rs, remote.rs), and the
# companion pet (companion.rs).
mighty-remote.workspace = true
mighty-companion.workspace = true
# W9-D: the style engine (styles.rs, settings/styles.rs, the phone's style parts).
mighty-styles.workspace = true
indexmap.workspace = true
base64 = "0.22"
# pickAttachments: the OS's file picker (C# FileOpenPicker), Rust-side only (no page permission).
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sys-locale.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["sync", "io-util", "time", "macros"] }

# The OS's implementation of the ports: chosen here and in src/platform.rs, nowhere else.
[target.'cfg(windows)'.dependencies]
mighty-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mighty-platform-macos.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "test-util"] }
