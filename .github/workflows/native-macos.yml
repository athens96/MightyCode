name: Native clients — macOS
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Build, test and capture the help screenshots (release.py dispatches this when a build commit's push run skipped the Mac)
        type: boolean
        default: true
      hosted:
        description: Build and test on GitHub's runners instead of the self-hosted Mac (when it is off)
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Without notarization the build job's zip is the release package; with it, the notarize job signs it and
  # publishes MightyCode-native-macos. The smoke job reads the same artifact.
  MAC_ZIP_ARTIFACT: ${{ (vars.MIGHTY_MAC_NOTARIZE == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && 'MightyCode-native-macos-unsigned' || 'MightyCode-native-macos' }}
jobs:
  changes:
    # Whether this run builds and tests the Mac app, and whether it captures the help screenshots
    # (release commits and full dispatches only): scripts/ci-changes.sh.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      help: ${{ steps.decide.outputs.help }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
          FULL: ${{ inputs.full }}
        run: bash scripts/ci-changes.sh macos

  macos-tests:
    # The Swift core tests and the mod's checks, on their own runner beside the build job.
    # The self-hosted Mac (runner label mighty-mac) for main pushes and dispatches, GitHub's runner for pull requests
    # and branches: a pull request's code never runs on that Mac.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ fromJSON((github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.hosted != true) && '["self-hosted", "mighty-mac"]' || '"macos-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report the selected Apple toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          xcrun swift --version
      - name: Restore SwiftPM downloads
        # GitHub's runners only: on the self-hosted Mac this is the developer's own cache.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Vendor/libghostty-spm/Package.swift') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mods/mighty-bridge/tests/package-lock.json
      - name: Design-token gate — colour and spacing literals only go down
        run: node scripts/check-design-tokens.js --check
      - name: Type-check and test the Claude mod
        working-directory: mods/mighty-bridge/tests
        run: npm ci --no-audit --no-fund && npm run check
      # 0.5: the Swift app no longer ships, so its own tests (Swift core, the remote loopback, the S1/S2 delegation records it
      # exported) no longer gate a release. The Rust app's tests, smokes and delegation records (S1-S3 through
      # delegation-record.py) run in native-tauri.yml; the Swift sources stay in native/macos only as the oracle
      # tools/parity-mac compiles from.

  macos:
    # 0.5: builds and packages the Rust + Tauri app (native/tauri, scripts/build-tauri-macos.sh) in the 0.4.x bundle, so an installed
    # Swift 0.4.x app updates itself to it; the same runner rule as macos-tests. It never opens the app's window (on the self-hosted
    # Mac that would be a second instance beside the developer's): its only runs of the binary are the headless --verify-resources
    # (as build-macos.sh's) and Swift's stager reading the zip. The GUI checks are macos-smoke's.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ fromJSON((github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.hosted != true) && '["self-hosted", "mighty-mac"]' || '"macos-latest"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the whole history is fetched.
          fetch-depth: 0
      - name: Report the selected Apple toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
      # The 0.4.x stager's verdict on the zip comes from Swift's own code (native/tauri/tools/parity-mac over native/macos).
      - name: Restore SwiftPM downloads
        # GitHub's runners only: on the self-hosted Mac this is the developer's own cache.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Vendor/libghostty-spm/Package.swift') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # GitHub's runners only, as the other caches.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            native/windows/web/package-lock.json
            native/tauri/package-lock.json
      # Rust: installed and cached on GitHub's runners; the self-hosted Mac's own toolchain is used as it is (never changed by CI).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted'
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: native/tauri -> target
          key: macos-release
      - name: The self-hosted Mac's Rust toolchain
        if: runner.environment != 'github-hosted'
        run: |
          cargo --version && rustc --version || { echo "::error::no Rust toolchain on this runner (install rustup there, or dispatch with hosted)"; exit 1; }
          rustc -vV | grep -qx 'host: aarch64-apple-darwin' || { echo "::error::the self-hosted Mac's Rust is not for arm64"; exit 1; }
      # A push to main builds the package a release ships, so it carries the pinned browser engine
      # (CEF, BrowserEngine.lock) as the Mac release zips always have; other runs build without it.
      - name: Restore the pinned browser engine (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/MightyCode/browser-engine
          key: browser-engine-${{ hashFiles('native/macos/BrowserEngine.lock') }}
      - name: Fetch the pinned browser engine (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/fetch-browser-engine.sh
      - name: Build the Rust app, its bundle and zip, and the 0.4.x stager's verdict
        id: build-app
        env:
          # The update channel's address and public key, as native-windows.yml stamps them; repository variables override.
          MIGHTY_UPDATE_URL: ${{ vars.MIGHTY_UPDATE_URL || 'https://pub-b705901d18c940159d40f58683d758ad.r2.dev/mightycode/latest.json' }}
          MIGHTY_UPDATE_PUBLIC_KEY: ${{ vars.MIGHTY_UPDATE_PUBLIC_KEY || 'C02DD3qWG+A5gJdYwpaEnvpzYugo354CLtUtU+oXmZ4=' }}
          ENGINE: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && '--engine' || '' }}
          # Ad-hoc, as on GitHub's runners: on the self-hosted Mac the developer's own signing identity (and a
          # keychain prompt) must never come into CI. The notarize job signs with the Developer ID.
          MIGHTY_CODESIGN_IDENTITY: '-'
        # Packs release/MightyCode-macos.zip and applies the size gate itself.
        run: bash scripts/build-tauri-macos.sh $ENGINE
      - name: Gate the release package size before upload
        run: scripts/check-release-size.sh release/MightyCode-macos.zip
      # Without notarization (any branch, or main before the repository variable
      # MIGHTY_MAC_NOTARIZE is 1) this ad-hoc zip is the release package. With it,
      # the zip goes to the notarize-macos job, which signs, notarizes and adds the dmg.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAC_ZIP_ARTIFACT }}
          path: release/MightyCode-macos.zip
          if-no-files-found: error


  macos-smoke:
    # The app's GUI checks and the help screenshots, on a GitHub runner with the app the build job made: they
    # launch the app (a second instance on a developer's Mac breaks its Korean input) and the help capture puts
    # demo folders in the home folder, so they never run on the self-hosted Mac. 0.5: the Tauri smoke
    # (native/tauri/src-tauri/src/smoke.rs: the page, the terminal, the browser, setup, files, updates, …) in place of the
    # Swift app's GUI, terminal, graph, setup, work map and delegation smokes; the help capture is the Rust app's (plan D15).
    needs: [changes, macos]
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MAC_ZIP_ARTIFACT }}
          path: ${{ runner.temp }}/built
      - name: Unpack the built app
        id: unpack
        run: |
          mkdir -p release/tauri-macos
          ditto -x -k "$RUNNER_TEMP/built/MightyCode-macos.zip" release/tauri-macos
          test -x release/tauri-macos/MightyCode.app/Contents/MacOS/MightyCode
      # The smoke seeds its demo profile with cargo (mighty-core's seed_demo).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: macos-smoke
      - name: Delegation server lists its six tools headlessly; mighty-terminal keeps its four tools
        # The app binary as the two stdio MCP servers a run can launch.
        if: (success() || failure()) && steps.unpack.outcome == 'success'
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          app = "release/tauri-macos/MightyCode.app/Contents/MacOS/MightyCode"
          env = {k: v for k, v in os.environ.items() if not k.startswith("MIGHTY_")}
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          def ask(mode):
              run = subprocess.run([app, mode], input="".join(json.dumps(r) + "\n" for r in requests),
                                   capture_output=True, text=True, timeout=60, env=env)
              answers = {a.get("id"): a.get("result", {}) for a in map(json.loads, filter(None, run.stdout.splitlines()))}
              return run.returncode, answers.get(1, {}).get("serverInfo", {}).get("name"), [t.get("name") for t in answers.get(2, {}).get("tools", [])]
          terminal = ask("--agent-io-mcp")
          delegation = ask("--agent-delegation-mcp")
          print(json.dumps({"terminal": terminal, "delegation": delegation}))
          four = ["run_in_terminal", "read_latest_output", "stop", "open_url"]
          six = ["delegate", "list_children", "child_status", "merge", "follow_up", "discard"]
          problems = []
          if terminal != (0, "mighty-terminal", four):
              problems.append(f"--agent-io-mcp answered {terminal}")
          if delegation != (0, "mighty-delegation", six):
              problems.append(f"--agent-delegation-mcp answered {delegation}")
          for problem in problems:
              print(f"::error title=macOS MCP servers::{problem}", flush=True)
          sys.exit(1 if problems else 0)
          PY
      - name: Smoke on the built app against the seeded demo profile
        if: (success() || failure()) && steps.unpack.outcome == 'success'
        timeout-minutes: 15
        shell: pwsh
        run: ./native/tauri/scripts/smoke.ps1 -Exe release/tauri-macos/MightyCode.app/Contents/MacOS/MightyCode -NoRuns -Out "$env:RUNNER_TEMP/mighty-native-smoke"
      - name: Upload the smoke's result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-smoke
          path: ${{ runner.temp }}/mighty-native-smoke/
          if-no-files-found: warn
      - name: Capture help screenshots in four languages
        # The help site's pictures (docs/help/shots.json) from the bundled demo profile, one launch per language in a fresh profile,
        # light and dark. Only release commits and full dispatches take them.
        if: (success() || failure()) && needs.changes.outputs.help == 'true' && steps.unpack.outcome == 'success'
        timeout-minutes: 30
        run: |
          set -u
          APP=release/tauri-macos/MightyCode.app/Contents/MacOS/MightyCode
          status=0
          for lang in ko en zh ja; do
            profile="$RUNNER_TEMP/mighty-help-$lang"
            rm -rf "$profile"
            echo "::group::Help capture ($lang)"
            # perl's alarm bounds one launch, so a stuck language cannot use up the step.
            if ! perl -e 'alarm shift; exec @ARGV' 420 "$APP" --help-capture --smoke-exit --profile "$profile" -language "$lang"; then
              echo "::error title=Help capture ($lang)::the app exited non-zero or timed out"
              status=1
            fi
            echo "::endgroup::"
          done
          python3 - <<'PY' || status=1
          import json, os, pathlib, sys
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          shots = json.loads(pathlib.Path("docs/help/shots.json").read_text())["shots"]
          expected = {f'{s["id"]}-{t}.png' for s in shots for t in s.get("themes", ["light", "dark"])}
          bad = False
          for lang in ["ko", "en", "zh", "ja"]:
              folder = temp / f"mighty-help-{lang}" / "help-shots" / lang
              manifest_path = folder / "manifest.json"
              if not manifest_path.exists():
                  print(f"::error title=Help capture ({lang})::no manifest.json was written", flush=True)
                  bad = True
                  continue
              manifest = json.loads(manifest_path.read_text())
              failed = [s for s in manifest.get("shots", []) if s.get("status") != "ok"]
              ok = {s["file"] for s in manifest.get("shots", []) if s.get("status") == "ok" and (folder / s["file"]).exists()}
              missing = sorted(expected - ok)
              print(f"{lang}: {len(ok)} of {len(expected)} pictures, {len(failed)} failed")
              if manifest.get("error"):
                  print(f'::error title=Help capture ({lang})::{manifest["error"]}', flush=True)
              for shot in failed:
                  print(f'::error title=Help shot {lang}/{shot.get("file")}::{shot.get("error", "failed")}', flush=True)
              if not manifest.get("passed") or failed or missing:
                  if missing and not failed:
                      print(f'::error title=Help capture ({lang})::missing {", ".join(missing[:20])}', flush=True)
                  bad = True
          sys.exit(1 if bad else 0)
          PY
          exit $status
      - name: Upload help screenshots
        if: always() && needs.changes.outputs.help == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-help-shots
          path: ${{ runner.temp }}/mighty-help-*/help-shots/
          if-no-files-found: warn

  notarize-macos:
    # Developer ID signing and notarization for main pushes, so a downloaded app
    # opens without Gatekeeper's warning. The certificate and the notary key are
    # secrets of the `release` environment (main only); the build job above never
    # sees them. Actions are pinned to commit SHAs, as in release-manifest.yml.
    # A full dispatch on main (a release build from a commit whose push run skipped the Mac) is signed too.
    # Only the build: it signs while the tests and the GUI checks run, and a release still needs the whole run green.
    needs: macos
    if: vars.MIGHTY_MAC_NOTARIZE == '1' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: MightyCode-native-macos-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Unpack the built app
        run: ditto -x -k "$RUNNER_TEMP/unsigned/MightyCode-macos.zip" "$RUNNER_TEMP/app"
      - name: Put the Developer ID certificate in a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MIGHTY_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MIGHTY_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "MIGHTY_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Write the notary API key
        env:
          NOTARY_KEY: ${{ secrets.MIGHTY_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOTARY_KEY"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "MIGHTY_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Install dmgbuild (hash-pinned) for the dmg's install window
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r scripts/dmg/requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple the app; build the dmg
        env:
          MIGHTY_NOTARY_KEY_ID: ${{ secrets.MIGHTY_NOTARY_KEY_ID }}
          MIGHTY_NOTARY_ISSUER_ID: ${{ secrets.MIGHTY_NOTARY_ISSUER_ID }}
        run: scripts/notarize-macos.sh "$RUNNER_TEMP/app/MightyCode.app" release
      - name: Gate the release package sizes before upload
        run: |
          scripts/check-release-size.sh release/MightyCode-macos.zip
          scripts/check-release-size.sh release/MightyCode-macos.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MightyCode-native-macos
          path: |
            release/MightyCode-macos.zip
            release/MightyCode-macos.dmg
          if-no-files-found: error
      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
