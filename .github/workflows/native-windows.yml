name: Native clients — Windows
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Build and test (release.py dispatches this when a build commit's push run skipped Windows)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # Cancel superseded PR runs; never cancel pushes or dispatches on main.
  group: native-windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.run_id || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Whether this run builds and tests Windows (skipped when only Mac or relay files changed) and runs the Rust checks
    # (rust: pushes that change what the Rust workspace builds or reads): scripts/ci-changes.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
          FULL: ${{ inputs.full }}
        run: bash scripts/ci-changes.sh windows

  rust:
    # The shared Rust crates' format, lints and tests on Windows, the gate main's pushes had not had (native-tauri.yml runs the
    # same checks on pull requests only). A debug build of its own, beside the release build below, on x64 alone: the
    # crates' logic does not differ by architecture, and the arm64 release build still compiles everything. Its twin is
    # native-macos.yml's macos-rust.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust checks (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: native/tauri
    env:
      CARGO_TERM_COLOR: always
      # scripts/env.ps1 imports vcvars64 on the development PC; the runner's Visual Studio is found by rustc itself.
      MIGHTY_TAURI_ENV: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: windows-rust-checks
      - name: Rust — format
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt --check failed' }
      - name: Rust — clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed' }
      - name: Rust — tests
        # Every test target runs even after one fails, so one red run names every failure. The --skip names are tests that hold
        # a wall-clock bound and fail on a loaded runner with no code change behind them: skipped in CI only and still run by
        # every local cargo test, as the Swift tests' CIRunner did (the same list in native-macos.yml and native-tauri.yml).
        run: |
          cargo test --workspace --no-fail-fast -- `
            --skip install_on_quit_waits_for_the_app_but_not_for_its_headless_children `
            --skip a_wake_calls_back_until_the_subscription_ends `
            --skip a_windows_host_refuses_codex_and_antigravity_until_the_switch_is_on
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }

  windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            native/windows/web/package-lock.json
            native/tauri/package-lock.json
      # 0.5: the app is the Rust + Tauri one (native/tauri); the .NET SDK stays for the 0.4.x stager's verdict on the zip.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: windows-${{ matrix.architecture }}
      - name: Web UI — install, typecheck and unit tests
        shell: pwsh
        # The window is this page (native/windows/web); the Tauri build below runs its npm run build --mode tauri into dist-tauri.
        working-directory: native/windows/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'web typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'web unit tests failed' }
      - name: Locale gate — missing keys and touched-file Korean check
        shell: pwsh
        run: |
          $sha = (Get-Content scripts/locale-touched-baseline).Trim()
          node scripts/check-locales.js --check --touched-since $sha
      - name: Design-token gate — colour and spacing literals only go down
        shell: pwsh
        run: node scripts/check-design-tokens.js --check
      - name: Install Inno Setup 6 for the setup program
        shell: pwsh
        # Always the pinned release, checked by its SHA-256 before it runs, never whatever Inno Setup the runner image carries.
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download does not match its pinned SHA-256' }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$dir/ISCC.exe")) { throw "Inno Setup install failed ($($process.ExitCode))" }
          "MIGHTY_ISCC=$dir/ISCC.exe" >> $env:GITHUB_ENV
      - name: Release build of the Rust app, ZIP, setup program and the 0.4.x stager's verdict
        shell: pwsh
        # The update address and the public half of the update signing key, as the Mac release
        # build stamps them; the signing key itself never leaves the release machine.
        env:
          MIGHTY_TAURI_ENV: '1'
          MIGHTY_UPDATE_URL: https://pub-b705901d18c940159d40f58683d758ad.r2.dev/mightycode/latest.json
          MIGHTY_UPDATE_PUBLIC_KEY: C02DD3qWG+A5gJdYwpaEnvpzYugo354CLtUtU+oXmZ4=
        run: ./scripts/build-tauri-windows.ps1 -Architecture ${{ matrix.architecture }} -Installer
      - name: The exe imports no C runtime DLL
        shell: pwsh
        run: ./native/tauri/scripts/check-imports.ps1 -Exe ./release/tauri-windows-${{ matrix.architecture }}/MightyCode.exe
      - name: The exe as 0.4.x starts its update helper (bare environment, no window)
        shell: pwsh
        timeout-minutes: 6
        run: ./native/tauri/scripts/helper-e2e.ps1 -Exe ./release/tauri-windows-${{ matrix.architecture }}/MightyCode.exe
      - name: Launch the app with a seeded profile and check its smoke
        shell: pwsh
        timeout-minutes: 15
        env:
          MIGHTY_TAURI_ENV: '1'
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'packaged-app'
          Copy-Item -Recurse ./release/tauri-windows-${{ matrix.architecture }} $app
          Push-Location native/tauri
          cargo build -q -p mighty-run --bin mighty-fake-cli
          if ($LASTEXITCODE -ne 0) { throw 'building mighty-fake-cli failed' }
          Pop-Location
          Copy-Item native/tauri/target/debug/mighty-fake-cli.exe $app
          ./native/tauri/scripts/smoke.ps1 -Exe (Join-Path $app 'MightyCode.exe') -Out "$env:RUNNER_TEMP/mighty-windows-smoke-${{ matrix.architecture }}"
          if ($LASTEXITCODE -ne 0) { throw "the smoke failed ($LASTEXITCODE)" }
      - name: Install the setup program for this user, check it, and uninstall it
        shell: pwsh
        timeout-minutes: 6
        run: ./scripts/test-windows-installer.ps1 -Setup ./release/MightyCode-windows-${{ matrix.architecture }}-setup.exe -Version (Get-Content VERSION -Raw).Trim() -Layout tauri
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-native-windows-${{ matrix.architecture }}
          path: |
            release/MightyCode-windows-${{ matrix.architecture }}.zip
            release/MightyCode-windows-${{ matrix.architecture }}.zip.sha256
            release/MightyCode-windows-${{ matrix.architecture }}-setup.exe
            release/MightyCode-windows-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
      - name: Upload the smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-windows-${{ matrix.architecture }}-smoke
          path: ${{ runner.temp }}/mighty-windows-smoke-${{ matrix.architecture }}
          if-no-files-found: warn
