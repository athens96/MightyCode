name: Native clients — Tauri (0.5)
# The Rust + Tauri 2 rewrite (native/tauri, docs/tauri-conversion.md), on Windows and on the Mac: the shared crates' tests run
# against the ports' fakes on both, so the shared logic gives the same result on each OS (docs/tauri-architecture.md §5). The
# shipping 0.4.x workflows (native-windows.yml, native-macos.yml) are untouched and independent of this one. W9: the source guards, the
# release candidate packaged in the 0.4.x shape for x64 and arm64 (package; Actions artifacts only, nothing published) and the update
# rehearsal from real 0.4.59 and 0.4.61 installs (rehearsal). The switch of native-windows.yml to this build at the 0.5 merge is prepared
# as native/tauri/release/native-windows.yml.0.5.patch, not applied. Mac stage Step 0: the Mac leg runs the smoke too (WebKit), its gate
# every check outside smoke.rs' MAC_PENDING_STEPS (every step at first; each Mac part's merge takes out what passes), kept as
# tauri-smoke-macos (spike R8: what the page does in WebKit); mac-base, the Mac stage's orchestrator branch, runs it on push. Mac stage
# M-I: the Mac release candidate in the 0.4.x bundle (package-macos: scripts/build-tauri-macos.sh, ad hoc, the hardened runtime under a
# throwaway identity, Swift's own stager; Actions artifacts only) and the update rehearsal from real Swift 0.4.59 and 0.4.61 installs
# (rehearsal-macos: scripts/update-rehearsal-macos.sh, on its throwaway runner); the switch of native-macos.yml at the 0.5 merge is
# native/tauri/release/native-macos.yml.0.5.patch (checked against origin/main's file by the guards); the notarization dry run
# (notarize-dry-run-build, then notarize-dry-run in environment release, D20) runs only when the user dispatches it on main with
# notarize_dry_run, and keeps only the verdicts.
on:
  push:
    branches: [feat/tauri, mac-base]
  pull_request:
    paths:
      - 'native/tauri/**'
      - 'native/windows/web/**'
      - 'native/contracts/**'
      - 'locales/**'
      - '.github/workflows/native-tauri.yml'
  workflow_dispatch:
    inputs:
      notarize_dry_run:
        description: On main only, also sign the Mac candidate with the real Developer ID, notarize and staple it, keeping only the verdicts (environment release; the user only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A push cancels the push before it on the same branch; a dispatched run (the notarization dry run among them) is in a group of its
  # own and is never cancelled by a push (review M-I 3).
  group: native-tauri-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  tauri:
    name: Tauri ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    # Mac stage Step 0: the Mac leg's smoke (up to its own limit, 400 s on the Mac since the integration) made the job longer.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          # Apple silicon (arm64), as the Mac app ships.
          - os: macos
            runner: macos-latest
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      # scripts/env.ps1 imports vcvars64 on the development PC, whose Build Tools vswhere does not list; the runners' Visual
      # Studio is found by rustc itself.
      MIGHTY_TAURI_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            native/windows/web/package-lock.json
            native/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
      - name: libghostty for the Mac's terminal (M-D; the Mac crate's build.rs links it with MIGHTY_MAC_NATIVE=1)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          xcframework="$(bash scripts/fetch-ghosttykit.sh "$RUNNER_TEMP/ghosttykit")"
          echo "MIGHTY_MAC_NATIVE=1" >> "$GITHUB_ENV"
          echo "MIGHTY_GHOSTTY_XCFRAMEWORK=$xcframework" >> "$GITHUB_ENV"
      - name: Install the page's and the Tauri CLI's packages
        run: |
          npm ci --no-audit --no-fund --prefix native/windows/web
          if ($LASTEXITCODE -ne 0) { throw 'npm ci (page) failed' }
          npm ci --no-audit --no-fund --prefix native/tauri
          if ($LASTEXITCODE -ne 0) { throw 'npm ci (Tauri CLI) failed' }
      - name: Page — typecheck and unit tests
        working-directory: native/windows/web
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'page typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'page unit tests failed' }
      - name: Rust — format
        working-directory: native/tauri
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt --check failed' }
      - name: Rust — clippy
        working-directory: native/tauri
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed' }
      - name: Rust — tests
        working-directory: native/tauri
        # Every test target runs even after one fails, so one red run names every failure (a failing target used to hide the
        # helper e2e of src-tauri that comes after it).
        env:
          # Mac stage (M-C's done-when): the delegation scenarios S1–S3 leave their records here for the record script below.
          MIGHTY_DELEGATION_RECORD_EXPORT: ${{ runner.temp }}/delegation-records
        run: |
          cargo test --workspace --no-fail-fast
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
      - name: The delegation record script judges its fixtures and the Rust scenarios' S1–S3 records (Mac)
        # As native-macos.yml judges Swift's S1 and S2: read-only, passed on each record the Rust scenarios left.
        if: (success() || failure()) && matrix.os == 'macos'
        shell: bash
        run: |
          python3 scripts/test_delegation_record.py -v
          status=0
          for record in s1 s2 s3; do
            folder="$RUNNER_TEMP/delegation-records/$record"
            echo "::group::Delegation record $record"
            python3 scripts/delegation-record.py --profile "$folder/profile" --repo "$folder/repo" --claude-dir "$folder/claude" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: The Mac's stores and update against the Swift app's own code (tools/parity-mac)
        # Mac stage M-B: Swift writes the state corpus and the pairing files with MightyCore's own code; Rust's tests load and save
        # them (MIGHTY_PARITY_MAC=require) and leave theirs; Swift reads Rust's back and wants every value it read from its own.
        # M-H: Rust's install.sh text equals Swift's installScript byte for byte, and its manifest parse reads the Mac's fields as
        # Swift's does (crates/mighty-updates/tests/app_update_mac_parity.rs). One build of the tool serves both.
        if: matrix.os == 'macos'
        working-directory: native/tauri
        timeout-minutes: 25
        run: |
          swift build -c release --package-path tools/parity-mac
          if ($LASTEXITCODE -ne 0) { throw 'parity-mac build failed' }
          $tool = (Resolve-Path 'tools/parity-mac/.build/release/parity-mac').Path
          $work = Join-Path $env:RUNNER_TEMP 'parity-mac'
          New-Item -ItemType Directory -Force $work | Out-Null
          & $tool state-corpus (Join-Path $work 'state')
          if ($LASTEXITCODE -ne 0) { throw 'parity-mac state-corpus failed' }
          & $tool pairing write (Join-Path $work 'pairing-swift') (Join-Path $work 'pairing-swift.json')
          if ($LASTEXITCODE -ne 0) { throw 'parity-mac pairing write failed' }
          & $tool defaults-keys | Set-Content -Encoding utf8 (Join-Path $work 'defaults-keys.json')
          if ($LASTEXITCODE -ne 0) { throw 'parity-mac defaults-keys failed' }
          $env:MIGHTY_PARITY_MAC = 'require'
          $env:MIGHTY_PARITY_MAC_DIR = $work
          $env:MIGHTY_PARITY_MAC_TOOL = $tool
          $failed = @()
          cargo test -p mighty-core --test state_mac -- --nocapture
          if ($LASTEXITCODE -ne 0) { $failed += 'Rust state round trip' }
          cargo test -p mighty-platform --test pairing_mac -- --nocapture
          if ($LASTEXITCODE -ne 0) { $failed += 'Rust pairing files' }
          cargo test -p mighty-platform-macos --lib defaults_keys -- --nocapture
          if ($LASTEXITCODE -ne 0) { $failed += 'Rust defaults keys' }
          cargo test -p mighty-updates --test app_update_mac_parity -- --nocapture
          if ($LASTEXITCODE -ne 0) { $failed += 'the Mac update parity' }
          if (Test-Path (Join-Path $work 'state')) {
            & $tool state-check (Join-Path $work 'state')
            if ($LASTEXITCODE -ne 0) { $failed += 'Swift state check' }
          }
          if (Test-Path (Join-Path $work 'pairing-rust.json')) {
            & $tool pairing read (Join-Path $work 'pairing-rust') (Join-Path $work 'pairing-rust.json')
            if ($LASTEXITCODE -ne 0) { $failed += 'Swift pairing read' }
          }
          if ($failed) { throw ("parity-mac: " + ($failed -join ', ')) }
      - name: Keep the Mac stores' parity files
        if: always() && matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-parity-mac
          # The state corpus and what Rust made of it; the pairing files hold only throwaway keys.
          path: ${{ runner.temp }}/parity-mac
          if-no-files-found: ignore
      - name: Build the Tauri app (debug)
        working-directory: native/tauri
        # beforeBuildCommand builds the page with --mode tauri into dist-tauri/ (never the dist/ the C# app ships).
        run: |
          npm run tauri build -- --debug
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }
      - name: The Rust exe's two MCP servers list their tools headlessly (Mac)
        # native-macos.yml's check of the Swift app, against the Rust exe: --agent-io-mcp is mighty-terminal with its four tools,
        # --agent-delegation-mcp mighty-delegation with its six.
        if: matrix.os == 'macos'
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          app = "native/tauri/target/debug/MightyCode"
          env = {k: v for k, v in os.environ.items() if not k.startswith("MIGHTY_")}
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          def ask(mode):
              run = subprocess.run([app, mode], input="".join(json.dumps(r) + "\n" for r in requests),
                                   capture_output=True, text=True, timeout=60, env=env)
              answers = {a.get("id"): a.get("result", {}) for a in map(json.loads, filter(None, run.stdout.splitlines()))}
              return run.returncode, answers.get(1, {}).get("serverInfo", {}).get("name"), [t.get("name") for t in answers.get(2, {}).get("tools", [])]
          terminal = ask("--agent-io-mcp")
          delegation = ask("--agent-delegation-mcp")
          print(json.dumps({"terminal": terminal, "delegation": delegation}))
          four = ["run_in_terminal", "read_latest_output", "stop", "open_url"]
          six = ["delegate", "list_children", "child_status", "merge", "follow_up", "discard"]
          problems = []
          if terminal != (0, "mighty-terminal", four):
              problems.append(f"--agent-io-mcp answered {terminal}")
          if delegation != (0, "mighty-delegation", six):
              problems.append(f"--agent-delegation-mcp answered {delegation}")
          for problem in problems:
              print(f"::error title=Rust MCP servers (Mac)::{problem}", flush=True)
          sys.exit(1 if problems else 0)
          PY
      - name: Smoke against the seeded demo profile
        if: matrix.os == 'windows'
        # W9 plan R13: the smoke's own limit grew by 45 s (AppUpdate, Styles, Mirror, Help, PaneWorktree stages).
        timeout-minutes: 10
        run: ./native/tauri/scripts/smoke.ps1 -Out "$env:RUNNER_TEMP/tauri-smoke"
      - name: Smoke on the Mac against the seeded demo profile (WebKit; the steps of smoke.rs' MAC_PENDING_STEPS may fail)
        if: matrix.os == 'macos'
        # The smoke's own limit on the Mac (400 s with the stand-in CLI, platform.rs), the seed and the stand-in's build.
        timeout-minutes: 12
        run: ./native/tauri/scripts/smoke.ps1 -Out "$env:RUNNER_TEMP/tauri-smoke"
      # M-E: the browser pane with CEF (plan D3): the debug app in a bundle with CEF 152, the Swift app's C bridge and the four helpers
      # (spikes/mac/cef/assemble.sh), against a seeded profile with the browser engine on, read-only, without the run steps.
      - name: Restore the browser engine (CEF, native/macos/BrowserEngine.lock)
        if: matrix.os == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/MightyCode/browser-engine
          key: tauri-browser-engine-${{ hashFiles('native/macos/BrowserEngine.lock') }}
      - name: Smoke on the Mac with CEF (the browser engine on; the steps of smoke.rs' MAC_PENDING_STEPS may fail)
        if: matrix.os == 'macos'
        timeout-minutes: 18
        env:
          # The bridge's own trace of each browser's create and close (cef_bridge.m), on stderr.
          MIGHTY_CEF_TRACE: '1'
        run: |
          bash scripts/fetch-browser-engine.sh
          if ($LASTEXITCODE -ne 0) { throw 'fetching CEF failed' }
          $app = Join-Path $env:RUNNER_TEMP 'MightyCode.app'
          bash native/tauri/spikes/mac/cef/assemble.sh native/tauri/target/debug/MightyCode $app MightyCode dev.mightycode.tests.cef
          if ($LASTEXITCODE -ne 0) { throw 'assembling the CEF bundle failed' }
          $seeded = Join-Path $env:RUNNER_TEMP 'tauri-smoke-cef-profile'
          Push-Location native/tauri
          cargo run -q -p mighty-core --example seed_demo -- $seeded en
          if ($LASTEXITCODE -ne 0) { throw 'seed_demo failed' }
          Pop-Location
          python3 -c "import json,sys; p=sys.argv[1]; s=json.load(open(p)); s['browserEngineEnabled']=True; json.dump(s, open(p,'w'))" (Join-Path $seeded 'workspace-state.json')
          if ($LASTEXITCODE -ne 0) { throw 'turning the browser engine on failed' }
          ./native/tauri/scripts/smoke.ps1 -Exe "$app/Contents/MacOS/MightyCode" -Profile $seeded -Out "$env:RUNNER_TEMP/tauri-smoke/cef" -NoRuns
      - name: The browser step passed on the Mac with WebKit and with CEF (M-E)
        if: matrix.os == 'macos'
        run: |
          foreach ($run in @(@{ path = "$env:RUNNER_TEMP/tauri-smoke/smoke-result.json"; engine = 'webkit' },
                             @{ path = "$env:RUNNER_TEMP/tauri-smoke/cef/smoke-result.json"; engine = 'cef' })) {
            $result = Get-Content -Raw $run.path | ConvertFrom-Json
            $names = @('browserSurface', 'browserNavigated', 'browserBack', 'browserPopupBlocked', 'browserMenuOver', 'browserTwoPanesRenderJavaScript',
              'browserIndependentProfiles', 'browserClosingOnePaneKeepsOtherAlive', 'browserReopenCycles', 'browserPaneWithoutAppIpc')
            $failed = @($names | Where-Object { $result.checks.$_ -ne $true })
            "$($run.engine): engine $($result.browser.browserEngine), failed: $($failed -join ', ')"
            if ($result.browser.browserEngine -ne $run.engine) { throw "the $($run.engine) run's browser panes used $($result.browser.browserEngine)" }
            if ($failed.Count -gt 0) { throw "the $($run.engine) run's browser step failed: $($failed -join ', ')" }
          }
          # Quitting with a live CEF pane shuts CEF down before the process ends (plan M-E's "done when").
          $shutdown = Select-String -Path "$env:RUNNER_TEMP/tauri-smoke/cef/tauri-logs/host.log" -Pattern 'browser engine: CEF shut down in'
          if (-not $shutdown) { throw 'the CEF run never logged its shutdown' }
          $shutdown.Line
      - name: The frozen style files are read in place, never written (mighty-styles, the smoke)
        # scripts/check-style-freeze.sh's frozen paths: the tests and the smoke above leave them as checked out.
        run: |
          $changed = git status --porcelain --untracked-files=all -- styles native/macos/Sources/MightyCore/Styles native/macos/Sources/MightyCore/Resources/Styles mobile/src/lib/styles.ts docs/mighty-styles.md
          if ($changed) { $changed; throw 'the run changed frozen style files' }
      - name: Keep the smoke's result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/tauri-smoke
          if-no-files-found: ignore

  guards:
    # W9 plan D4, D6, R4, R6: what only certain files may do, read from the source (no build needed).
    name: Tauri source guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
        working-directory: native/tauri
    steps:
      - uses: actions/checkout@v4
      - name: Detached starts only in the update modules; no verify_strict; "runas" only for the firewall rule
        run: |
          # Each rule: a pattern on code lines (comments left out) and the files allowed to match it, with why.
          # The port itself (its default, the fake, the Windows implementation) and its contract tests.
          $port = @('crates/mighty-platform/src/process.rs', 'crates/mighty-platform/src/unsupported.rs', 'crates/mighty-platform/src/fake.rs',
            'crates/mighty-platform-windows/src/process.rs', 'crates/mighty-platform/tests/ports.rs',
            # Mac stage M-A: the Mac implementation and its contract test of both detached starts.
            'crates/mighty-platform-macos/src/process.rs', 'crates/mighty-platform-macos/tests/detached.rs')
          $rules = @(
            @{ what = 'ProcessHost::start_detached / start_detached_or_in_job called'; pattern = '\bstart_detached(_or_in_job)?\s*\('; skip = '\bfn\s+start_detached'
               allowed = @(
                 # The only callers (W9 plan D6): the helper's relaunch, the app's helper launch, the Windows update seams.
                 'src-tauri/src/update_helper.rs', 'src-tauri/src/app_update.rs', 'crates/mighty-platform-windows/src/update.rs',
                 'crates/mighty-platform-windows/tests/update_helper.rs',
                 # Mac stage M-H: the Mac's install.sh started by its update installer (and that file's own check).
                 'crates/mighty-platform-macos/src/update.rs') + $port },
            @{ what = 'ProcessHost::start_detached_waitable called'; pattern = '\bstart_detached_waitable\s*\('; skip = '\bfn\s+start_detached_waitable'
               allowed = @(
                 # The Ouroboros dashboard daemon, which C# leaves running (W9-E), and the Windows implementation's own contract test.
                 'src-tauri/src/ouroboros.rs', 'crates/mighty-platform-windows/tests/detached_waitable.rs') + $port },
            # Any other detached start the port grows is named in this guard, with its callers, before anything calls it.
            @{ what = 'another ProcessHost::start_detached_* called'; pattern = '\bstart_detached_(?!or_in_job\b|waitable\b)\w+\s*\('; skip = '\bfn\s+start_detached_'
               allowed = $port },
            # ed25519-dalek's verify_strict refuses small-order points C#'s Ed25519Verify accepts (plan D6, R4): never, anywhere.
            @{ what = 'verify_strict used'; pattern = 'verify_strict'; skip = $null; allowed = @() },
            @{ what = 'the "runas" verb'; pattern = '(?i)"runas"'; skip = $null
               allowed = @(
                 # The Tailscale firewall rule's change, the one elevation the app asks for (W8).
                 'crates/mighty-platform-windows/src/firewall.rs',
                 # Checks that no setup step elevates.
                 'crates/mighty-tools/tests/setup.rs', 'src-tauri/src/smoke_setup.rs') }
          )
          $root = (Get-Location).Path
          $files = Get-ChildItem -Recurse -File -Filter *.rs | Where-Object { $_.FullName -notmatch '[\\/](target|node_modules)[\\/]' }
          $bad = @()
          foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            $number = 0
            foreach ($line in [IO.File]::ReadAllLines($file.FullName)) {
              $number++
              if ($line.TrimStart().StartsWith('//')) { continue }
              foreach ($rule in $rules) {
                if ($line -match $rule.pattern -and -not ($rule.skip -and $line -match $rule.skip) -and $rule.allowed -notcontains $relative) {
                  $bad += "$($rule.what) outside its files: ${relative}:$number  $($line.Trim())"
                }
              }
            }
          }
          if ($bad.Count -gt 0) { $bad; throw "$($bad.Count) guard violation(s)" }
          "checked $($files.Count) Rust files"
      - name: Every PlatformProfile field is read where its behaviour is
        run: |
          # Mac stage M-J: a deliberate difference between the OSes is a PlatformProfile field (no cfg(target_os) in shared crates), and
          # a field nothing reads describes a behaviour that is not there. Each field must be read as `profile.<field>` or
          # `profile().<field>` in product code: profile.rs itself, tests/ folders, each file's `#[cfg(test)] mod` (to the file's end)
          # and comments do not count.
          # Fields wired on a Mac part's branch not merged yet (empty since the Mac stage's integration: every part is in):
          $pending = @{}
          $definition = 'crates/mighty-platform/src/profile.rs'
          $profile = [IO.File]::ReadAllText((Join-Path (Get-Location) $definition))
          $body = [regex]::Match($profile, '(?s)pub struct PlatformProfile \{(.*?)\n\}').Groups[1].Value
          $fields = [regex]::Matches($body, '(?m)^\s*pub (\w+):') | ForEach-Object { $_.Groups[1].Value }
          if ($fields.Count -lt 5) { throw "PlatformProfile's fields were not found ($($fields.Count))" }
          $root = (Get-Location).Path
          $sources = Get-ChildItem -Recurse -File -Filter *.rs | Where-Object {
            $relative = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            $relative -ne $definition -and $relative -notmatch '(^|/)(target|node_modules|tests|spikes)/' }
          $code = foreach ($file in $sources) {
            $text = [IO.File]::ReadAllText($file.FullName)
            $text = [regex]::Replace($text, '(?s)#\[cfg\(test\)\]\s*mod\s+\w+\s*\{.*$', '')
            $text = [regex]::Replace($text, '(?s)/\*.*?\*/', '')
            [regex]::Replace($text, '(?m)(^|\s)//.*$', '$1')
          }
          $text = $code -join "`n"
          $unread = @()
          foreach ($field in $fields) {
            $read = [regex]::IsMatch($text, "profile(\(\))?\s*\.\s*$field\b")
            if (-not $read -and -not $pending.ContainsKey($field)) { $unread += $field }
            if ($read -and $pending.ContainsKey($field)) { "$field is read now: take it out of the pending list ($($pending[$field]))" }
          }
          if ($unread.Count -gt 0) { "unread PlatformProfile fields: $($unread -join ', ')"; throw "$($unread.Count) unread profile field(s)" }
          "$($fields.Count) fields, every one read ($($pending.Count) pending on other parts' branches)"
      - name: The Mac update's temporary direct TLS is gone once M-C's HTTPS backs it
        # Mac stage review M-H 3: update_transport.rs's DirectTls (no system proxy) only until the integrator implements its Connect for
        # M-C's MacHttps; from then on no file may name it.
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.rs | Where-Object { $_.FullName -notmatch '[\\/](target|node_modules)[\\/]' }
          $wired = $files | Select-String -Pattern 'impl\s+(\S+::)*Connect\s+for\s+MacHttps' -List
          $left = $files | Select-String -Pattern '\bDirectTls\b' -List
          if ($wired -and $left) { $left | ForEach-Object { "$($_.Path):$($_.LineNumber)" }; throw 'DirectTls is still named after MacHttps backs the update transport' }
          if ($wired) { 'MacHttps backs the update transport; DirectTls is gone' } else { 'MacHttps not wired yet: DirectTls stays (temporary)' }
      - name: The prepared 0.5 switch of native-macos.yml applies to main's
        # Mac stage M-I: native/tauri/release/native-macos.yml.0.5.patch is applied at the 0.5 merge; checked here against
        # origin/main's native-macos.yml in a scratch index (nothing is checked out or changed).
        shell: bash
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin main
          export GIT_INDEX_FILE="$RUNNER_TEMP/main.index"
          git read-tree FETCH_HEAD
          git apply --cached --check --verbose native/tauri/release/native-macos.yml.0.5.patch

  package:
    # The release candidate in the 0.4.x shape (W9 plan §1.6, D10, D13, D15): what native-windows.yml builds from the C# app, here from
    # the Rust one, under the same artifact names. Built and kept as Actions artifacts only; nothing is uploaded anywhere else.
    name: Package ${{ matrix.architecture }}
    needs: tauri
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      MIGHTY_TAURI_ENV: '1'
      # A candidate's version (build-tauri-windows.ps1 -Version): newer than VERSION, so a 0.4.x install takes it as an update.
      CANDIDATE: 0.5.0-rc.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            native/windows/web/package-lock.json
            native/tauri/package-lock.json
      # The 0.4.x stager's verdict on the zip comes from C#'s own code (tools/parity `update stage`).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: package-${{ matrix.architecture }}
      - name: Install Inno Setup 6 for the setup program
        # As native-windows.yml: the pinned release, checked by its SHA-256 before it runs.
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download does not match its pinned SHA-256' }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$dir/ISCC.exe")) { throw "Inno Setup install failed ($($process.ExitCode))" }
          "MIGHTY_ISCC=$dir/ISCC.exe" >> $env:GITHUB_ENV
      - name: Release build, zip, setup program and the 0.4.x stager's verdict
        # The update address and the public half of the update signing key, as native-windows.yml stamps the C# app; the signing key
        # itself is never read here.
        env:
          MIGHTY_UPDATE_URL: https://pub-b705901d18c940159d40f58683d758ad.r2.dev/mightycode/latest.json
          MIGHTY_UPDATE_PUBLIC_KEY: C02DD3qWG+A5gJdYwpaEnvpzYugo354CLtUtU+oXmZ4=
        run: ./scripts/build-tauri-windows.ps1 -Architecture ${{ matrix.architecture }} -Installer -Version $env:CANDIDATE
      - name: The packaged exe imports no C runtime DLL
        run: ./native/tauri/scripts/check-imports.ps1 -Exe ./release/tauri-windows-${{ matrix.architecture }}/MightyCode.exe
      - name: The packaged exe as 0.4.x starts its update helper (bare environment, no window)
        timeout-minutes: 6
        run: ./native/tauri/scripts/helper-e2e.ps1 -Exe ./release/tauri-windows-${{ matrix.architecture }}/MightyCode.exe
      - name: Smoke on the packaged app
        timeout-minutes: 15
        # A copy of the package's folder, with mighty-run's stand-in CLI beside the exe for the run steps (smoke.ps1 looks for it
        # there; it is never part of the package).
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'packaged-app'
          Copy-Item -Recurse ./release/tauri-windows-${{ matrix.architecture }} $app
          Push-Location native/tauri
          cargo build -q -p mighty-run --bin mighty-fake-cli
          if ($LASTEXITCODE -ne 0) { throw 'building mighty-fake-cli failed' }
          Pop-Location
          Copy-Item native/tauri/target/debug/mighty-fake-cli.exe $app
          ./native/tauri/scripts/smoke.ps1 -Exe (Join-Path $app 'MightyCode.exe') -Out "$env:RUNNER_TEMP/package-smoke"
          if ($LASTEXITCODE -ne 0) { throw "the smoke failed ($LASTEXITCODE)" }
      - name: Install the setup program for this user, check it, and uninstall it
        timeout-minutes: 6
        run: ./scripts/test-windows-installer.ps1 -Setup ./release/MightyCode-windows-${{ matrix.architecture }}-setup.exe -Version ($env:CANDIDATE -split '-')[0] -Layout tauri
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-native-windows-${{ matrix.architecture }}
          path: |
            release/MightyCode-windows-${{ matrix.architecture }}.zip
            release/MightyCode-windows-${{ matrix.architecture }}.zip.sha256
            release/MightyCode-windows-${{ matrix.architecture }}-setup.exe
            release/MightyCode-windows-${{ matrix.architecture }}-setup.exe.sha256
          if-no-files-found: error
      - name: Keep the packaged smoke's result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-package-smoke-${{ matrix.architecture }}
          path: ${{ runner.temp }}/package-smoke
          if-no-files-found: ignore

  rehearsal:
    # W9 plan D11: a real 0.4.x install, built from its tag with a throwaway key, updates itself to the x64 package above from a local
    # HTTPS server; then the relaunch path (scripts/update-rehearsal.ps1). On this throwaway runner only.
    name: Rehearsal from ${{ matrix.from }}
    needs: package
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        from: [v0.4.59, v0.4.61]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      MIGHTY_TAURI_ENV: '1'
      MIGHTY_REHEARSAL_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags the 0.4.x app is built from.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python's cryptography (the throwaway key, certificate and manifest signature)
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
      # The post-update smoke seeds its profile with cargo (mighty-core's seed_demo).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: rehearsal
      - name: Install Inno Setup 6 for the 0.4.x setup program
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download does not match its pinned SHA-256' }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$dir/ISCC.exe")) { throw "Inno Setup install failed ($($process.ExitCode))" }
          "MIGHTY_ISCC=$dir/ISCC.exe" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: MightyCode-native-windows-x64
          path: ${{ runner.temp }}/rust-package
      - name: Rehearse the update from ${{ matrix.from }}
        run: ./scripts/update-rehearsal.ps1 -From ${{ matrix.from }} -RustZip "$env:RUNNER_TEMP/rust-package/MightyCode-windows-x64.zip" -Work "$env:RUNNER_TEMP/rehearsal"
      - name: Keep the rehearsal's result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-rehearsal-${{ matrix.from }}
          path: |
            ${{ runner.temp }}/rehearsal/*.json
            ${{ runner.temp }}/rehearsal/*.log
            ${{ runner.temp }}/rehearsal/server.*
            ${{ runner.temp }}/rehearsal/smoke
            ${{ runner.temp }}/rehearsal/read-only-logs
            ${{ runner.temp }}/rehearsal/logs
          if-no-files-found: ignore

  package-macos:
    # Mac stage M-I: the Mac release candidate in the 0.4.x bundle (scripts/build-tauri-macos.sh: MightyCode.app, dev.mightycode.native,
    # the browser engine, signed ad hoc, --verify-resources, the size gate and Swift's own stager's verdict), then the same app under the
    # hardened runtime with a throwaway self-signed identity: codesign's strict check, --verify-resources, the MCP servers and the smoke
    # with WebKit and with CEF on it. Stamped with a throwaway update key and the rehearsal's loopback address (rehearsal-macos below
    # serves it), never the real ones; Actions artifacts only.
    name: Package macOS
    runs-on: macos-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Newer than VERSION, so a 0.4.x install takes it as an update (build-tauri-macos.sh --version).
      CANDIDATE: 0.5.0-rc.${{ github.run_number }}
      # The address the candidate checks: the rehearsal's server listens there (the Mac's stamped address wins over a saved one).
      REHEARSAL_MANIFEST_URL: https://127.0.0.1:47615/latest.json
      CODESIGN_NAME: Mighty Code CI throwaway
    steps:
      - uses: actions/checkout@v4
        with:
          # CFBundleVersion is the commit count.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            native/windows/web/package-lock.json
            native/tauri/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python's cryptography (the throwaway update key)
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: package-macos
      - name: Restore the browser engine (CEF, native/macos/BrowserEngine.lock)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/MightyCode/browser-engine
          key: tauri-browser-engine-${{ hashFiles('native/macos/BrowserEngine.lock') }}
      - name: A throwaway update key for the candidate and its rehearsal
        run: |
          mkdir -p "$RUNNER_TEMP/rehearsal-key"
          public="$(python scripts/update-rehearsal-server.py keygen "$RUNNER_TEMP/rehearsal-key/update.key" | tail -n 1)"
          echo "$public" > "$RUNNER_TEMP/rehearsal-key/public-key.txt"
          echo "MIGHTY_UPDATE_PUBLIC_KEY=$public" >> "$GITHUB_ENV"
      - name: Release build, bundle, ad hoc signature, zip and the 0.4.x stager's verdict
        env:
          MIGHTY_UPDATE_URL: ${{ env.REHEARSAL_MANIFEST_URL }}
        run: |
          bash scripts/fetch-browser-engine.sh
          bash scripts/build-tauri-macos.sh --version "$CANDIDATE" --engine
      - name: What the bundle holds, and its signature
        run: |
          app="$PWD/release/tauri-macos/MightyCode.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier|CodeDirectory)'
          plutil -p "$app/Contents/Info.plist"
          find "$app/Contents" -maxdepth 2 -not -path '*/Chromium Embedded Framework.framework/*' | sed "s|^$app/||" | sort
          du -sh "$app" "$app/Contents/MacOS/MightyCode" "$app/Contents/Frameworks"/* "$app/Contents/Resources"/* | sed "s|$app/||"
          ls -l release/MightyCode-macos.zip
          cat release/MightyCode-macos.zip.sha256
          (cd /tmp && "$app/Contents/MacOS/MightyCode" --verify-resources)
      - name: The same app under the hardened runtime, signed by a throwaway self-signed identity
        # What notarization needs (plan R2), with no real credentials: every nested binary signed inside out with its entitlements
        # (scripts/sign-macos.sh --hardened-runtime), no get-task-allow, the CEF helpers' JIT, then the strict check.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hardened"
          mkdir -p "$work"
          printf '%s\n' '[req]' 'prompt = no' 'distinguished_name = dn' 'x509_extensions = v3' '[dn]' "CN = $CODESIGN_NAME" '[v3]' \
            'basicConstraints = critical,CA:false' 'keyUsage = critical,digitalSignature' 'extendedKeyUsage = codeSigning' > "$work/cert.conf"
          /usr/bin/openssl req -new -x509 -newkey rsa:2048 -nodes -keyout "$work/key.pem" -out "$work/cert.pem" -days 2 -config "$work/cert.conf"
          /usr/bin/openssl pkcs12 -export -out "$work/identity.p12" -inkey "$work/key.pem" -in "$work/cert.pem" -name "$CODESIGN_NAME" -passout pass:throwaway
          password="$(openssl rand -hex 16)"
          keychain="$work/throwaway.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$work/identity.p12" -k "$keychain" -P throwaway -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$work/cert.pem"
          rm -f "$work/key.pem" "$work/identity.p12"
          echo "CODESIGN_SHA1=$(/usr/bin/openssl x509 -in "$work/cert.pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"
          app="$work/MightyCode.app"
          ditto release/tauri-macos/MightyCode.app "$app"
          bash scripts/sign-macos.sh "$app" "$CODESIGN_NAME" --hardened-runtime
          codesign --verify --deep --strict --verbose=2 "$app"
          for code in "$app" "$app/Contents/Frameworks/"*.app; do
            codesign -dvv "$code" 2>&1 | grep -q 'flags=0x10000(runtime)' || { echo "::error::not under the hardened runtime: $code"; exit 1; }
            entitlements="$(codesign -d --entitlements :- "$code" 2>/dev/null)"
            if grep -q get-task-allow <<<"$entitlements"; then echo "::error::get-task-allow set: $code"; exit 1; fi
            grep -q com.apple.security.cs.allow-jit <<<"$entitlements" || { echo "::error::no allow-jit: $code"; exit 1; }
          done
          echo "the app and its $(ls -d "$app/Contents/Frameworks/"*.app | wc -l | tr -d ' ') helpers run under the hardened runtime with their entitlements"
          (cd /tmp && "$app/Contents/MacOS/MightyCode" --verify-resources)
          echo "HARDENED_APP=$app" >> "$GITHUB_ENV"
      - name: The hardened app's two MCP servers list their tools headlessly
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          app = os.environ["HARDENED_APP"] + "/Contents/MacOS/MightyCode"
          env = {k: v for k, v in os.environ.items() if not k.startswith("MIGHTY_")}
          requests = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          def ask(mode):
              run = subprocess.run([app, mode], input="".join(json.dumps(r) + "\n" for r in requests),
                                   capture_output=True, text=True, timeout=60, env=env)
              answers = {a.get("id"): a.get("result", {}) for a in map(json.loads, filter(None, run.stdout.splitlines()))}
              return run.returncode, answers.get(1, {}).get("serverInfo", {}).get("name"), [t.get("name") for t in answers.get(2, {}).get("tools", [])]
          terminal = ask("--agent-io-mcp")
          delegation = ask("--agent-delegation-mcp")
          print(json.dumps({"terminal": terminal, "delegation": delegation}))
          four = ["run_in_terminal", "read_latest_output", "stop", "open_url"]
          six = ["delegate", "list_children", "child_status", "merge", "follow_up", "discard"]
          problems = []
          if terminal != (0, "mighty-terminal", four):
              problems.append(f"--agent-io-mcp answered {terminal}")
          if delegation != (0, "mighty-delegation", six):
              problems.append(f"--agent-delegation-mcp answered {delegation}")
          for problem in problems:
              print(f"::error title=Packaged MCP servers (Mac)::{problem}", flush=True)
          sys.exit(1 if problems else 0)
          PY
      - name: Smoke on the hardened app (WebKit; the seeded demo profile, without the run steps)
        timeout-minutes: 15
        shell: pwsh
        run: ./native/tauri/scripts/smoke.ps1 -Exe "$env:HARDENED_APP/Contents/MacOS/MightyCode" -NoRuns -Out "$env:RUNNER_TEMP/package-smoke"
      - name: Smoke on the hardened app with CEF (the browser engine on)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $seeded = Join-Path $env:RUNNER_TEMP 'package-smoke-cef-profile'
          Push-Location native/tauri
          cargo run -q -p mighty-core --example seed_demo -- $seeded en
          if ($LASTEXITCODE -ne 0) { throw 'seed_demo failed' }
          Pop-Location
          python3 -c "import json,sys; p=sys.argv[1]; s=json.load(open(p)); s['browserEngineEnabled']=True; json.dump(s, open(p,'w'))" (Join-Path $seeded 'workspace-state.json')
          ./native/tauri/scripts/smoke.ps1 -Exe "$env:HARDENED_APP/Contents/MacOS/MightyCode" -Profile $seeded -Out "$env:RUNNER_TEMP/package-smoke/cef" -NoRuns
          if ($LASTEXITCODE -ne 0) { throw "the CEF smoke failed ($LASTEXITCODE)" }
          $result = Get-Content -Raw "$env:RUNNER_TEMP/package-smoke/cef/smoke-result.json" | ConvertFrom-Json
          if ($result.browser.browserEngine -ne 'cef') { throw "the browser panes used $($result.browser.browserEngine), not CEF" }
          'CEF under the hardened runtime: the browser step passed'
      - name: Remove the throwaway identity
        # Never interactive and never failing the job: each call is bounded (perl's alarm) and runs with sudo -n, and stdin is closed.
        # `security remove-trusted-cert` once waited here for an authorization no runner can give (44112802032): deleting the
        # certificate from the System keychain by its SHA-1 takes its trust with it, and the runner is thrown away anyway.
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          bounded() { perl -e 'alarm shift; exec @ARGV' 30 "$@" < /dev/null > /dev/null 2>&1 || true; }
          [ -z "${CODESIGN_SHA1:-}" ] || bounded sudo -n security delete-certificate -Z "$CODESIGN_SHA1" /Library/Keychains/System.keychain
          bounded security delete-keychain "$RUNNER_TEMP/hardened/throwaway.keychain-db"
      - name: Upload the candidate
        uses: actions/upload-artifact@v4
        with:
          name: MightyCode-native-macos-candidate
          path: |
            release/MightyCode-macos.zip
            release/MightyCode-macos.zip.sha256
          if-no-files-found: error
      - name: Keep the throwaway update key for the rehearsal
        # A key made for this run only (the candidate checks a loopback address); the real signing key is never on a runner.
        uses: actions/upload-artifact@v4
        with:
          name: tauri-rehearsal-key-macos
          path: ${{ runner.temp }}/rehearsal-key
          retention-days: 3
          if-no-files-found: error
      - name: Keep the packaged smokes' results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-package-smoke-macos
          path: ${{ runner.temp }}/package-smoke
          if-no-files-found: ignore

  rehearsal-macos:
    # Mac stage M-I (plan R1): a real Swift 0.4.x app, built from its tag with the candidate's throwaway key and loopback address,
    # updates itself to the candidate on quit; then the relaunch path and a Rust → Rust update (scripts/update-rehearsal-macos.sh).
    # It trusts a throwaway certificate system-wide and writes the runner user's defaults: on this throwaway runner only.
    name: Rehearsal macOS from ${{ matrix.from }}
    needs: package-macos
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        from: [v0.4.59, v0.4.61]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MIGHTY_REHEARSAL_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags the 0.4.x app is built from.
          fetch-depth: 0
      - name: Restore SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/macos/Package.resolved', 'native/macos/Vendor/libghostty-spm/Package.swift') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python's cryptography (the throwaway certificate and the manifest's signature)
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      # The post-update smoke seeds its profile with cargo (mighty-core's seed_demo).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tauri -> target
          key: rehearsal-macos
      - uses: actions/download-artifact@v4
        with:
          name: MightyCode-native-macos-candidate
          path: ${{ runner.temp }}/rust-package
      - uses: actions/download-artifact@v4
        with:
          name: tauri-rehearsal-key-macos
          path: ${{ runner.temp }}/rehearsal-key
      - name: Rehearse the update from ${{ matrix.from }}
        run: |
          bash scripts/update-rehearsal-macos.sh --from ${{ matrix.from }} --rust-zip "$RUNNER_TEMP/rust-package/MightyCode-macos.zip" \
            --key "$RUNNER_TEMP/rehearsal-key/update.key" --work "$RUNNER_TEMP/rehearsal"
      - name: Keep the rehearsal's result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-rehearsal-macos-${{ matrix.from }}
          path: |
            ${{ runner.temp }}/rehearsal/*.json
            ${{ runner.temp }}/rehearsal/*.log
            ${{ runner.temp }}/rehearsal/server.*
            ${{ runner.temp }}/rehearsal/served/latest*.json
            ${{ runner.temp }}/rehearsal/logs
            ${{ runner.temp }}/rehearsal/smoke
            ${{ runner.temp }}/rehearsal/read-only-logs
            ${{ runner.temp }}/rehearsal/rust-update-logs
            ${{ runner.temp }}/rehearsal/relaunch/*.log
            ${{ runner.temp }}/rehearsal/relaunch/install.sh
          if-no-files-found: ignore

  notarize-dry-run-build:
    # Plan D20, its first half (review M-I 1): the candidate built with the real update key's public half and address (as
    # native-macos.yml stamps the Swift app), signed ad hoc, with no environment and no secret: everything that runs third-party code
    # (npm, cargo build scripts, the fetch scripts, swift build) runs here, never beside the Developer ID. Only on main, only when the
    # user dispatches it with notarize_dry_run (the release environment allows main only; it is not opened to feat/tauri, which agents
    # push to). The unsigned zip lives for a day.
    name: Notarization dry run — build (macOS, no secrets)
    if: github.event_name == 'workflow_dispatch' && inputs.notarize_dry_run && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CANDIDATE: 0.5.0-rc.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Fetch the pinned browser engine
        run: bash scripts/fetch-browser-engine.sh
      - name: Release build of the candidate with the real update key's public half and address (ad hoc)
        env:
          MIGHTY_UPDATE_URL: ${{ vars.MIGHTY_UPDATE_URL || 'https://pub-b705901d18c940159d40f58683d758ad.r2.dev/mightycode/latest.json' }}
          MIGHTY_UPDATE_PUBLIC_KEY: ${{ vars.MIGHTY_UPDATE_PUBLIC_KEY || 'C02DD3qWG+A5gJdYwpaEnvpzYugo354CLtUtU+oXmZ4=' }}
        run: bash scripts/build-tauri-macos.sh --version "$CANDIDATE" --engine
      - uses: actions/upload-artifact@v4
        with:
          name: MightyCode-macos-notarize-input
          path: release/MightyCode-macos.zip
          retention-days: 1
          if-no-files-found: error

  notarize-dry-run:
    # Plan D20, its second half: the built candidate signed with the real Developer ID, notarized, stapled and assessed by
    # scripts/notarize-macos.sh, as main's notarize-macos does, in the environment release (main only). Only SHA-pinned actions and the
    # repository's own scripts run beside the secrets (review M-I 1). The repository is public, so its Actions artifacts are too: only
    # the verdicts are kept (notarytool's status and log, stapler validate, spctl --assess), never the signed app or dmg (review M-I 2).
    name: Notarization dry run (macOS, Developer ID)
    needs: notarize-dry-run-build
    if: github.event_name == 'workflow_dispatch' && inputs.notarize_dry_run && github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: MightyCode-macos-notarize-input
          path: ${{ runner.temp }}/unsigned
      - name: Unpack the built app
        run: ditto -x -k "$RUNNER_TEMP/unsigned/MightyCode-macos.zip" "$RUNNER_TEMP/app"
      - name: Put the Developer ID certificate in a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MIGHTY_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MIGHTY_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          # The decoded identity never outlives this step, whatever fails (review M-I 9).
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "MIGHTY_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Write the notary API key
        env:
          NOTARY_KEY: ${{ secrets.MIGHTY_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NOTARY_KEY"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "MIGHTY_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Install dmgbuild (hash-pinned) for the dmg's install window
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r scripts/dmg/requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Sign with the Developer ID, notarize, staple and assess (scripts/notarize-macos.sh, as notarize-macos does)
        env:
          MIGHTY_NOTARY_KEY_ID: ${{ secrets.MIGHTY_NOTARY_KEY_ID }}
          MIGHTY_NOTARY_ISSUER_ID: ${{ secrets.MIGHTY_NOTARY_ISSUER_ID }}
        run: |
          set -uo pipefail
          verdicts="$RUNNER_TEMP/verdicts"
          mkdir -p "$verdicts" "$RUNNER_TEMP/notarized"
          scripts/notarize-macos.sh "$RUNNER_TEMP/app/MightyCode.app" "$RUNNER_TEMP/notarized" 2>&1 | tee "$verdicts/notarize-macos.log"
          status=${PIPESTATUS[0]}
          # notarytool's own log of each submission (its id is in the script's "공증 <file>: <status> (<id>)" lines).
          for id in $(sed -n 's/^공증 .*(\([0-9a-f-]\{36\}\))$/\1/p' "$verdicts/notarize-macos.log"); do
            xcrun notarytool log "$id" --key "$MIGHTY_NOTARY_KEY_FILE" --key-id "$MIGHTY_NOTARY_KEY_ID" --issuer "$MIGHTY_NOTARY_ISSUER_ID" \
              "$verdicts/notarytool-$id.json" > /dev/null 2>&1 || true
          done
          { xcrun stapler validate "$RUNNER_TEMP/app/MightyCode.app"; echo "exit $?"; } > "$verdicts/stapler-validate.txt" 2>&1
          { spctl --assess --type execute --verbose=4 "$RUNNER_TEMP/app/MightyCode.app"; echo "exit $?"; } > "$verdicts/spctl-assess.txt" 2>&1
          { codesign -dvv "$RUNNER_TEMP/app/MightyCode.app"; } > "$verdicts/codesign.txt" 2>&1
          [ -f "$RUNNER_TEMP/notarized/MightyCode-macos.zip" ] && { scripts/check-release-size.sh "$RUNNER_TEMP/notarized/MightyCode-macos.zip" > "$verdicts/size-gate.txt" 2>&1 || status=1; }
          cat "$verdicts"/*.txt
          exit $status
      - name: Keep the verdicts only (the repository is public; the signed app and dmg are never uploaded)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MightyCode-macos-notarize-dry-run-verdicts
          path: ${{ runner.temp }}/verdicts
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the keychain, the key and the signed app
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/app" "$RUNNER_TEMP/notarized" "$RUNNER_TEMP/unsigned"
